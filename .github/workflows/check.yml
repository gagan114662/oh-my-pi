# Fast compile gate for repair branches: `cargo check` over every target in
# minutes, so a branch author learns about a type error before spending an
# hour-long full CI run. Not a proof of anything; the full `CI` workflow is.
name: Check

on:
  push:
    branches:
      - "fix/**"
      - "feat/**"
      - "test/**"
      - "audit/**"
      - "ci/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: cargo check (all targets)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-check-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-check-${{ runner.os }}-${{ runner.arch }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      # Examples are excluded: crates/webview's `child` example uses the
      # macOS-only `Engine::system` and does not compile on Linux (run
      # 34224250836). Libs, bins and every test target are what the CI
      # workflow compiles on this runner.
      - name: cargo check --workspace --lib --bins --tests
        run: cargo check --workspace --lib --bins --tests --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Tests of the crates this branch touches, against the integration
      # branch. Linux-runnable evidence per push; the full CI workflow on
      # macOS remains the acceptance proof.
      - name: nextest for touched crates
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=200 origin fix/audit-ci-gates
          base=$(git merge-base origin/fix/audit-ci-gates HEAD || echo origin/fix/audit-ci-gates)
          dirs=$(git diff --name-only "$base" HEAD -- crates | cut -d/ -f2 | sort -u)
          pkgs=""
          for d in $dirs; do
            [ -f "crates/$d/Cargo.toml" ] || continue
            name=$(sed -n 's/^name = "\(.*\)"/\1/p' "crates/$d/Cargo.toml" | head -1)
            case "$name" in omp-e2e|"") continue;; esac
            pkgs="$pkgs -p $name"
          done
          if [ -z "$pkgs" ]; then echo "no touched crates"; exit 0; fi
          echo "testing:$pkgs"
          cargo nextest run --profile ci --no-fail-fast --locked $pkgs 2>&1 | tee target/touched-tests.log
          {
            echo "### Touched-crate tests"
            echo '```'
            grep -E '^\s+(Summary|FAIL|PASS \[.*slow)' target/touched-tests.log | tail -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo clippy (workspace, warnings visible, not fatal)
        continue-on-error: true
        run: cargo clippy --workspace --lib --bins --tests --locked 2>&1 | tail -60
