name: CI
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'
jobs:
  exec_terminal_negative:
    name: Blocking terminal send negative control
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENVD_PROOF_DIR: ${{ github.workspace }}/target/envd-proof-${{ github.run_id
        }}-${{ github.run_attempt }}
    steps:
    - uses: actions/checkout@v4
    - name: Select pinned Rust toolchain
      run: 'test "$(uname -m)" = x86_64

        rustup show active-toolchain

        '
    - name: Install native build tools
      run: 'sudo apt-get update

        sudo apt-get install --no-install-recommends -y pipx zstd

        command -v uv >/dev/null || pipx install uv

        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        '
    - name: Install cargo-nextest
      uses: taiki-e/install-action@nextest
    - name: Cache embedded Python
      id: python-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: vendor/python
        key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh',
          'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py',
          'crates/py/requirements.txt') }}
    - name: Prepare embedded Python
      if: steps.python-cache.outputs.cache-hit != 'true'
      run: crates/py/scripts/fetch-python.sh
    - name: Verify embedded Python toolchain
      run: 'test -f vendor/python/pyo3-config.txt

        test -x vendor/python/install/bin/python3.14td

        '
    - name: Cache Cargo
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: '~/.cargo/registry/index

          ~/.cargo/registry/cache

          ~/.cargo/git/db

          target

          '
        key: cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock',
          'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha
          }}
        restore-keys: 'cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(''Cargo.lock'',
          ''Cargo.toml'', ''crates/*/Cargo.toml'', ''rust-toolchain.toml'') }}-

          cargo-p7-${{ runner.os }}-${{ runner.arch }}-

          '
    - name: Compile exact terminal regression
      run: cargo nextest run --profile ci --locked -p omp-envd --lib --no-run -E 'test(exec::tests::terminal_event_yields_on_a_full_queue_and_preserves_order)'
    - name: Run deliberate blocking-send negative
      run: 'set -o pipefail

        mkdir -p target/exec-terminal-negative

        set +e

        timeout --signal=TERM --kill-after=5s 30s cargo nextest run --profile ci --locked
        -p omp-envd --lib --no-tests fail --success-output immediate -E ''test(exec::tests::terminal_event_yields_on_a_full_queue_and_preserves_order)''
        2>&1 | tee target/exec-terminal-negative/nextest.log

        status=${PIPESTATUS[0]}

        printf ''%s\n'' "$status" > target/exec-terminal-negative/exit

        printf ''Deliberate blocking send: process exit %s (124 means external deadline
        after separate successful compilation).\n'' "$status" >> "$GITHUB_STEP_SUMMARY"

        exit "$status"

        '
    - name: Upload negative evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: exec-terminal-negative
        path: target/exec-terminal-negative/
        if-no-files-found: error
'on':
  push:
    branches:
    - main
    - omp2
    paths:
    - .cargo/**
    - .config/**
    - .github/workflows/ci.yml
    - about.toml
    - deny.toml
    - justfile
    - LICENSE*
    - THIRD-PARTY-NOTICES.txt
    - crates/**
    - examples/**
    - fixtures/**
    - docs/**
    - elastic/**
    - tools/**
    - scripts/**
    - Cargo.toml
    - Cargo.lock
    - clippy.toml
    - rust-toolchain.toml
    - rustfmt.toml
  pull_request:
    branches:
    - main
    - omp2
  workflow_dispatch:
    inputs:
      http_tests:
        description: Run the HTTP streaming contract checkpoint in addition to normal
          CI
        type: boolean
        required: false
        default: false
