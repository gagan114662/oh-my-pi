name: CI

on:
  push:
    branches: [main, omp2]
    paths:
      - ".cargo/**"
      - ".config/**"
      - ".github/workflows/ci.yml"
      - "about.toml"
      - "deny.toml"
      - "justfile"
      - "LICENSE*"
      - "THIRD-PARTY-NOTICES.txt"
      - "crates/**"
      - "examples/**"
      - "fixtures/**"
      - "docs/**"
      - "elastic/**"
      - "tools/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "clippy.toml"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
  pull_request:
    # No `paths:` filter here, deliberately. Once these jobs are required
    # contexts on a protected branch, a PR touching only unlisted paths
    # (docs/adr/**, AGENTS.md, elastic/**, .pr/**) triggers no run, the
    # required contexts stay "Expected", and the PR can never merge.
    # `push.paths` above is kept: pushes to main are upstream syncs.
    branches: [main, omp2]
  workflow_dispatch:
    inputs:
      http_tests:
        description: Run the HTTP streaming contract checkpoint in addition to normal CI
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  format:
    name: Rust format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check current ADR paths
        run: python3 scripts/check-adr-paths.py

      - name: Enforce model data ownership
        run: cargo run --release --locked --manifest-path tools/lintx/Cargo.toml -- --only model-gate --only model-table crates/ai/src

      - name: Test lint rules
        run: cargo test --release --locked --manifest-path tools/lintx/Cargo.toml

      - name: Test build prerequisite diagnostics
        run: python3 scripts/build-doctor-test.py

      - name: Publish format and source-contract result
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          echo "Format, current ADR paths, and model ownership: $CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "See this job's individual step logs for failures." >> "$GITHUB_STEP_SUMMARY"

  adr_status:
    name: ADR status lint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check every architecture status
        run: python3 scripts/check-adr-status.py --report target/adr-status.json
      - name: Prove missing gaps fail the gate
        run: python3 scripts/test-adr-status.py
      - name: Publish architecture status evidence
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = Path("target/adr-status.json")
          if not report.exists():
              raise SystemExit("ADR status evidence is missing")
          data = json.loads(report.read_text())
          print("| Architecture record | Status | Explicit gap |")
          print("| --- | --- | --- |")
          for row in data["records"]:
              gap = 'yes' if row['gap'] else ('MISSING' if row['status'] == 'Partial' else 'not required')
              print(f"| {row['path']} | {row['status']} | {gap} |")
          for failure in data["failures"]:
              print(f"Violation: {failure['path']}:{failure['line']}: {failure['reason']}")
          PY
      - name: Upload architecture status evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: adr-status-evidence
          path: target/adr-status.json
          if-no-files-found: error
          retention-days: 14

  tlc:
    name: tlc ElasticSlots
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Java runtime
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Test model-check runner failure paths
        run: python3 scripts/check-tla-test.py
      - name: Check every TLA+ and PlusCal variant
        if: ${{ !cancelled() }}
        timeout-minutes: 32
        run: >-
          python3 scripts/check-tla.py --download --output target/tlc
          --timeout 600 --heap-mb 4096 --disk-mb 4096
      - name: Regenerate original-model traces for Rust correspondence
        run: python3 scripts/generate-elastic-refinement.py --jar target/tlc-tools/tla2tools-1.8.0.jar --output target/tlc/refinement --check
      - name: Publish TLC evidence status
        if: always()
        env:
          CHECK_STATUS: ${{ job.status }}
        run: |
          mkdir -p target/tlc
          echo "TLC job status: $CHECK_STATUS" >> "$GITHUB_STEP_SUMMARY"
          if [ ! -f target/tlc/summary.md ]; then
            echo "TLC did not finish its summary. The check is incomplete; retained logs are diagnostic evidence only." | tee target/tlc/incomplete.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload all model-check evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tlc-output
          path: target/tlc/
          if-no-files-found: error
          retention-days: 14

  runtime_spec:
    name: Runtime symbol and dependency contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Generate and validate runtime specification
        run: cargo -Zscript scripts/check-spec.rs -- target/runtime-symbol-spec.json

  licenses:
    name: License policy and release notices
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install pinned compliance tools
        run: |
          cargo install --locked --version 1.58.0 just
          cargo install --locked --version 0.20.2 cargo-deny
          cargo install --locked --version 0.8.2 cargo-about
      - name: Check license policy and release notices
        run: just license-check

      - name: Upload resolved license inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-license-inventory
          path: target/rust-license-data.json
          if-no-files-found: warn
          retention-days: 14

  elastic_refinement:
    name: Production Slots model correspondence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Replay TLC traces through the production Slots renderer
        run: |
          set -o pipefail
          mkdir -p target/elastic-refinement
          cargo nextest run --profile ci --locked -p omp-tui --test elastic_refinement --no-tests fail --success-output immediate 2>&1 | tee target/elastic-refinement/replay.log
          cat target/elastic-refinement/replay.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Rust model correspondence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elastic-model-rust-correspondence
          path: target/elastic-refinement/
          if-no-files-found: warn
          retention-days: 14


  http_contracts:
    name: HTTP bounded stream contracts
    if: github.event_name == 'workflow_dispatch' && inputs.http_tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
      - name: Select pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - name: Exercise all HTTP contract tests and doctests
        shell: bash
        run: |
          mkdir -p target/http-contracts
          set +e
          cargo nextest run --profile ci --locked -p omp-http --no-tests fail --success-output immediate 2>&1 | tee target/http-contracts/nextest.log
          test_status=${PIPESTATUS[0]}
          printf '%s\n' "$test_status" > target/http-contracts/nextest.exit
          cargo test --doc --locked -p omp-http 2>&1 | tee target/http-contracts/doctests.log
          doc_status=${PIPESTATUS[0]}
          printf '%s\n' "$doc_status" > target/http-contracts/doctests.exit
          if [ "$test_status" -ne 0 ] || [ "$doc_status" -ne 0 ]; then exit 1; fi
      - name: Publish observed streaming contract results
        if: always()
        run: |
          mkdir -p target/http-contracts
          python3 - <<'PY_REPORT'
          import json, os, re
          from pathlib import Path
          root = Path('target/http-contracts')
          log = (root / 'nextest.log').read_text(errors='replace') if (root / 'nextest.log').exists() else ''
          summaries = re.findall(r'Summary[^\n]*?([0-9]+) tests? run:[^\n]*', log)
          executed = int(summaries[-1]) if summaries else 0
          exits = {name: int((root / f'{name}.exit').read_text()) if (root / f'{name}.exit').exists() else None for name in ('nextest', 'doctests')}
          observations = re.findall(r'offered_bytes=[0-9]+ sent_bytes=[0-9]+ peer_closed=true', log)
          report = {'commit': os.environ['GITHUB_SHA'], 'executed': executed, 'exit_codes': exits, 'peer_observations': observations}
          (root / 'summary.json').write_text(json.dumps(report, indent=2) + '\n')
          lines = ['### HTTP streaming contracts', '', f"Commit: `{report['commit']}`", '', f'Executed tests: **{executed}**; exit codes: `{exits}`.', '', 'The peer generates a 1 GiB stream in fixed-size chunks. Each observation below is printed only after the real peer observes socket closure:', '', *observations, '', 'Includes declared/chunked byte limits, an absolute request deadline during arriving body data, cancellation after consuming body bytes, and default/disabled redirect behavior.', '', 'This checkpoint does not replace the workspace-wide per-crate inventory or red-before/green-after evidence required by #45.']
          summary = '\n'.join(lines) + '\n'
          (root / 'summary.md').write_text(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output: output.write(summary)
          if executed < 5 or len(observations) < 4 or any(code != 0 for code in exits.values()):
              raise SystemExit('Missing or failed HTTP contract evidence')
          PY_REPORT
      - name: Upload HTTP contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: http-contracts-linux
          path: target/http-contracts/
          if-no-files-found: error
          retention-days: 14

  roster_coverage:
    name: Native tool roster source coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inventory every native tool implementation
        run: python3 scripts/check-tool-roster.py --self-test
      - name: Publish full family coverage table
        if: always()
        run: cat target/tool-roster/coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload roster source coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tool-roster-coverage
          path: target/tool-roster/
          if-no-files-found: error
          retention-days: 14

  rust:
    name: Rust workspace and acceptance proofs
    needs: [format, adr_status, runtime_spec, licenses, roster_coverage]
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = arm64
          rustup show active-toolchain

      - name: Install native build tools
        run: brew install lld@22 uv zstd ninja
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            vendor/python
            vendor/python-release
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: |
          test -f vendor/python/pyo3-config.txt
          crates/py/scripts/ld64.lld --version

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-${{ runner.arch }}-

      - name: Lint workspace
        run: cargo clippy --workspace --locked

      - name: Test workspace
        run: cargo nextest run --profile ci --workspace --exclude omp-e2e --locked
      # nextest cannot run doctests; omp has them in 25+ modules, so they need
      # their own libtest pass or the coverage silently disappears.
      - name: Test doctests
        run: cargo test --doc --workspace --exclude omp-e2e --locked

      - name: Gate frozen Python examples
        run: python3 scripts/check-python-examples.py

      - name: Compile acceptance proofs
        run: cargo nextest run -p omp-e2e --tests --no-run --locked

      - name: Run acceptance proofs P1-P6
        run: |
          cargo nextest run --profile ci -p omp-e2e --locked \
            --test p1_doc_race \
            --test p2_cancel_matrix \
            --test p3_detached_jobs \
            --test p4_schema_isolation \
            --test p5_prefix_stability \
            --test p6_crash_resume

      - name: Run acceptance proofs P9-P10 and tool sources
        run: |
          cargo nextest run --profile ci -p omp-e2e --locked \
            --test p9_isolation \
            --test p9_extension_control \
            --test p10_lift_idempotence \
            --test tool_sources

      - name: Run terminal proof P7
        env:
          TERM: xterm-256color
        run: cargo nextest run --profile ci -p omp-e2e --test p7_tui --locked

      - name: Validate P8 baseline contract
        run: cargo nextest run --profile ci -p omp-e2e --test p8_baselines --locked

      - name: Record P8 baseline
        continue-on-error: true
        run: |
          cargo run -p omp-e2e --bin baseline --locked -- \
            --artifact target/e2e-artifacts/p8-baselines.json

      - name: Upload P8 baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: omp-e2e-baseline-macos-arm64
          path: target/e2e-artifacts/p8-baselines.json
          if-no-files-found: warn
          retention-days: 14

  p7_linux:
    name: Terminal proof P7 (Linux PTY)
    needs: format
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ENVD_PROOF_DIR: ${{ github.workspace }}/target/envd-proof-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - name: Select pinned Rust toolchain
        run: |
          test "$(uname -m)" = x86_64
          rustup show active-toolchain

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pipx zstd
          command -v uv >/dev/null || pipx install uv
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache embedded Python
        id: python-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor/python
          key: python-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/py/scripts/fetch-python.sh', 'crates/py/scripts/pack-pymodules.py', 'crates/py/scripts/gen-py-notices.py', 'crates/py/requirements.txt') }}

      - name: Prepare embedded Python
        if: steps.python-cache.outputs.cache-hit != 'true'
        run: crates/py/scripts/fetch-python.sh

      - name: Verify embedded Python toolchain
        run: |
          test -f vendor/python/pyo3-config.txt
          test -x vendor/python/install/bin/python3.14td

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-p7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml') }}-
            cargo-p7-${{ runner.os }}-${{ runner.arch }}-

      - name: Prove Linux move attribute preservation
        run: |
          set -o pipefail
          mkdir -p target
          cargo nextest run --profile ci -p omp-shell-builtins --lib --locked \
            -E 'test(xattr) | test(cross_filesystem_fallback)' 2>&1 | tee target/linux-xattr-proof.log
          cargo test --doc -p omp-shell-builtins --locked

      - name: Publish Linux attribute proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-xattr-proof
          path: target/linux-xattr-proof.log
          if-no-files-found: warn
          retention-days: 14

      - name: Publish compiled tool roster policy proof
        run: |
          set -o pipefail
          mkdir -p "$ENVD_PROOF_DIR"/roster
          cargo nextest run --profile ci -p omp-envd --locked --no-tests fail --success-output immediate -E 'test(every_environment_family_has_one_advertised_surface_in_each_policy)' 2>&1 | tee "$ENVD_PROOF_DIR"/roster/policy.log
          cat "$ENVD_PROOF_DIR"/roster/policy.log >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compiled roster proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-tool-roster-policy-proof
          path: ${{ env.ENVD_PROOF_DIR }}/roster/policy.log
          if-no-files-found: warn
          retention-days: 14
      - name: Prove managed skill discovery roundtrip
        run: |
          set -o pipefail
          mkdir -p target/managed-skill-proof
          cargo nextest run --profile ci --locked -p omp-driver --test managed_skill_roundtrip --no-tests fail 2>&1 | tee target/managed-skill-proof/nextest.log
          cargo test --doc --locked -p omp-driver 2>&1 | tee target/managed-skill-proof/doctests.log

      - name: Publish managed skill proof
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-skill-roundtrip
          path: target/managed-skill-proof/
      - name: Prove approved command wrapper validation
        run: |
          set -o pipefail
          mkdir -p target/approved-scope-proof
          set +e
          cargo nextest run --profile ci --locked -p omp-shell --lib -E 'test(commands::sandbox_tests)' --no-tests fail 2>&1 | tee target/approved-scope-proof/shell.log
          test_status=${PIPESTATUS[0]}
          cargo test --doc --locked -p omp-shell 2>&1 | tee target/approved-scope-proof/doctests.log
          doc_status=${PIPESTATUS[0]}
          printf '%s\n' "$test_status" > target/approved-scope-proof/nextest.exit
          printf '%s\n' "$doc_status" > target/approved-scope-proof/doctests.exit
          if [ "$test_status" -ne 0 ] || [ "$doc_status" -ne 0 ]; then exit 1; fi

      - name: Publish approved command wrapper evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: approved-command-wrapper
          path: target/approved-scope-proof/
          if-no-files-found: error

      - name: Prove authenticated proxy header boundaries
        run: |
          set -o pipefail
          mkdir -p target/proxy-header-proof
          cargo nextest run --profile ci --locked -p omp-envd --lib -E 'test(headers_are_bounded_cumulatively_and_by_count)' --no-tests fail --success-output immediate 2>&1 | tee target/proxy-header-proof/nextest.log
          cargo test --doc --locked -p omp-envd 2>&1 | tee target/proxy-header-proof/doctests.log

      - name: Publish proxy header boundary evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-header-boundaries
          path: target/proxy-header-proof/
          if-no-files-found: error

      - name: Prove Linux environment host contracts
        env:
          CARGO_TERM_COLOR: never
        run: |
          mkdir -p "$ENVD_PROOF_DIR"
          set +e
          cargo nextest run --profile ci --locked -p omp-envd --lib --tests --no-tests fail 2>&1 | tee "$ENVD_PROOF_DIR"/nextest.log
          test_status=${PIPESTATUS[0]}
          printf '%s\n' "$test_status" > "$ENVD_PROOF_DIR"/nextest.exit
          cargo test --doc --locked -p omp-envd 2>&1 | tee "$ENVD_PROOF_DIR"/doctests.log
          doc_status=${PIPESTATUS[0]}
          printf '%s\n' "$doc_status" > "$ENVD_PROOF_DIR"/doctests.exit
          if [ "$test_status" -ne 0 ] || [ "$doc_status" -ne 0 ]; then exit 1; fi

      - name: Summarize Linux environment host evidence
        if: always()
        run: |
          python3 - <<'PY_SUMMARY'
          import json, os, pathlib, re
          root = pathlib.Path(os.environ['ENVD_PROOF_DIR'])
          root.mkdir(parents=True, exist_ok=True)
          log = (root/'nextest.log').read_text(errors='replace') if (root/'nextest.log').exists() else ''
          counts = re.findall(r'Summary[^\n]*?([0-9]+) tests run:', log)
          exits = {name: int((root/(name+'.exit')).read_text()) if (root/(name+'.exit')).exists() else None for name in ('nextest','doctests')}
          result = {'revision': os.environ['GITHUB_SHA'], 'tests_run': int(counts[-1]) if counts else None, 'exit_codes': exits}
          (root/'summary.json').write_text(json.dumps(result, indent=2)+'\n')
          text = '# Linux environment host evidence\n\n```json\n'+json.dumps(result, indent=2)+'\n```\n\nAll envd library/integration tests and doctests are requested. Missing execution is unknown, never a pass.\n'
          (root/'summary.md').write_text(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as stream: stream.write(text)
          if not result['tests_run'] or any(code != 0 for code in exits.values()): raise SystemExit(1)
          PY_SUMMARY

      - name: Publish Linux environment host evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: envd-contracts-linux
          path: ${{ env.ENVD_PROOF_DIR }}/
          if-no-files-found: error
          retention-days: 14

      - name: Run terminal proof P7 on Linux PTY
        env:
          TERM: xterm-256color
        run: cargo nextest run --profile ci -p omp-e2e --test p7_tui --locked
